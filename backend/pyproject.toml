[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finwhiz-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "langchain-openai>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "tiktoken>=0.8,<1", "pypdf>=6,<7",
  "truststore>=0.10.5,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
finwhiz = "finwhiz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finwhiz = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
